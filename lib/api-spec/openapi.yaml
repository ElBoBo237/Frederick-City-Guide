openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: AI city guide chat
  - name: dishes
    description: Visitor-submitted dish photos
paths:
  /dishes:
    get:
      operationId: listDishPhotos
      tags: [dishes]
      summary: List dish photos newest first
      responses:
        "200":
          description: Dish photos without their image data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhoto"
    post:
      operationId: createDishPhoto
      tags: [dishes]
      summary: Upload a dish photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDishPhotoInput"
      responses:
        "201":
          description: The saved dish photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhoto"
        "400":
          description: The title or image is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The JSON request body exceeds 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The image does not show the featured dish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The image inspector could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes/{id}/image:
    get:
      operationId: getDishPhotoImage
      tags: [dishes]
      summary: Get the image bytes for a dish photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The dish photo image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Dish photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/system-prompt:
    get:
      operationId: getCityChatSystemPrompt
      tags: [chat]
      summary: Get the city guide system prompt
      responses:
        "200":
          description: The system prompt used by the city guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPromptResponse"
  /chat:
    post:
      operationId: sendCityChatMessage
      tags: [chat]
      summary: Ask the AI city guide a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityChatInput"
      responses:
        "200":
          description: The city guide's answer and usage information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityChatResponse"
        "400":
          description: The request message or settings are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The AI provider could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The Gemini API key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CreateDishPhotoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        caption:
          type: string
          maxLength: 500
        image:
          type: string
          description: Base64 data URL for a JPEG, PNG, or WebP image up to 3 MB
      required:
        - title
        - image
    DishPhoto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        inspectorNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
      required:
        - id
        - title
        - caption
        - mimeType
        - inspectorNote
        - createdAt
        - imageUrl
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SystemPromptResponse:
      type: object
      properties:
        systemPrompt:
          type: string
      required:
        - systemPrompt
    ChatSettingsInput:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
    ChatSettings:
      type: object
      properties:
        temperature:
          type: number
        topP:
          type: number
        maxOutputTokens:
          type: integer
      required:
        - temperature
        - topP
        - maxOutputTokens
    ChatHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - role
        - content
    CityChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/ChatHistoryMessage"
        settings:
          $ref: "#/components/schemas/ChatSettingsInput"
      required:
        - message
    CityChatUsage:
      type: object
      properties:
        promptTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        finishReason:
          type: ["string", "null"]
      required:
        - promptTokens
        - outputTokens
        - totalTokens
        - finishReason
    CityChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          $ref: "#/components/schemas/CityChatUsage"
        settings:
          $ref: "#/components/schemas/ChatSettings"
        model:
          type: string
      required:
        - reply
        - usage
        - settings
        - model
    ApiError:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
      required:
        - error
